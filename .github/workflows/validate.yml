name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build --target checkout -t checkout:ci .
      - run: docker build --target booth -t booth:ci .
  deployment-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - run: kubectl kustomize gitops/apps/checkout/booth > /tmp/checkout.yaml
      - run: |
          az bicep install
          az bicep build --file infra/main.bicep
          az bicep build --file infra/booth.bicep
          az bicep build --file infra/agent-access.bicep
