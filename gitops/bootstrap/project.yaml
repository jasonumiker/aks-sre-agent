apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: booth
  namespace: argocd
spec:
  description: Isolated checkout booth demo
  sourceRepos:
    - https://github.com/jasonumiker/aks-sre-agent.git
  destinations:
    - namespace: booth
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: DaemonSet
    - group: ""
      kind: Service
    - group: ""
      kind: ResourceQuota
