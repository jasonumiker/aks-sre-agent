apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        booth.example/scenario: no-such-node
      containers:
        - name: checkout
          env:
            - name: CHECKOUT_MODE
              value: conference
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
