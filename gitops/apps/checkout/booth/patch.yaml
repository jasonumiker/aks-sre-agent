apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: checkout
          env:
            - name: CHECKOUT_MODE
              value: invalid-demo-mode
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
